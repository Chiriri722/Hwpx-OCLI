[package]
name = "officecli-hwpx"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "OfficeCLI dump-reader plugin for HWP/HWPX/OWPML/HWPML documents with an optional RHWP bridge"
license = "MIT"
repository = "https://github.com/Chiriri722/Hwpx-OCLI"

# 한글 계열의 정식 진입점. 설치 스크립트 전환(T1-4) 전까지 아래의 기존
# PATH 탐색 이름도 같은 구현을 가리키는 호환 별칭으로 유지한다.
[[bin]]
name = "officecli-hancom-hwp"
path = "src/bin/officecli-hancom-hwp.rs"

[[bin]]
name = "officecli-dump-reader-hwpx"
path = "src/bin/officecli-dump-reader-hwpx.rs"

[[bin]]
name = "officecli-hancom-hwpx"
path = "src/bin/officecli-hancom-hwpx.rs"

[lib]
name = "officecli_hwpx"
path = "src/lib.rs"

[dependencies]
officecli-hancom-core = { path = "../hancom-core" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.0"
# HWP 5.x protocol fixtures use a synthetic CFB container.
cfb = "0.14.0"
predicates = "3.1.4"
