[package]
name = "officecli-hwpx"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "OfficeCLI dump-reader plugin for HWP/HWPX documents with an optional RHWP bridge"
license = "MIT"
repository = "https://github.com/Chiriri722/Hwpx-OCLI"

# 기존 HWPX PATH 탐색 이름은 유지한다. HWP는 확장자별 환경변수 또는
# 사용자 plugin 디렉터리로 등록하며 별도 PATH alias는 아직 제공하지 않는다.
[[bin]]
name = "officecli-dump-reader-hwpx"
path = "src/bin/officecli-dump-reader-hwpx.rs"

[lib]
name = "officecli_hwpx"
path = "src/lib.rs"

[dependencies]
officecli-hancom-core = { path = "../hancom-core" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
# HWP 5.x protocol fixtures use a synthetic CFB container.
cfb = "0.14.0"
predicates = "3.1.4"
