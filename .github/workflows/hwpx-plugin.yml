name: HWPX plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/hancom/**'
      - 'plugins/plugin-protocol.md'
      - 'src/officecli/Core/Plugins/**'
      - 'src/officecli/CommandBuilder.Plugins.cs'
      - 'tests/OfficeCli.Tests/**'
      - 'global.json'
      - '.github/workflows/hwpx-plugin.yml'
  push:
    paths:
      - 'plugins/hancom/**'
      - 'plugins/plugin-protocol.md'
      - 'src/officecli/Core/Plugins/**'
      - 'src/officecli/CommandBuilder.Plugins.cs'
      - 'tests/OfficeCli.Tests/**'
      - 'global.json'
      - '.github/workflows/hwpx-plugin.yml'

permissions:
  contents: read

jobs:
  host-contract:
    name: OfficeCLI plugin host contract (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 (v5.4.0)
        with:
          dotnet-version: '10.0.302'

      - name: Test plugin discovery and registration contracts
        run: dotnet run --project tests/OfficeCli.Tests/OfficeCli.Tests.csproj -p:NuGetAudit=false

  msrv:
    name: Rust 1.88 MSRV (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
    defaults:
      run:
        working-directory: plugins/hancom

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # branch: 1.88.0 (Rust 1.88.0)

      - name: Check all targets on the declared MSRV
        run: cargo check --workspace --locked --all-targets

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            rhwp_asset: rhwp-v0.8.4-linux-x86_64.tar.gz
            rhwp_sha256: 'd2f015447147a840b3a587e8e9bedd75973fb2e0a60eac37b08cad9e34cdac54'
          - name: Windows x64
            os: windows-latest
            rhwp_asset: rhwp-v0.8.4-windows-x86_64.zip
            rhwp_sha256: 'e65b3e220573b18e1588768c5a16684eb89b2daf2488768575444cb83cd1b8c6'

    env:
      RHWP_VERSION: v0.8.4
      HWP_FIXTURE_URL: https://raw.githubusercontent.com/edwardkim/rhwp/496333b27d21ddb9114ba9ae340bcb895870c9a7/samples/basic/english.hwp
      HWP_FIXTURE_SHA256: 'ee72c16067013e110528375f04b2d123a8c4b0eaa9fee35fb39983614791e7e9'

    defaults:
      run:
        working-directory: plugins/hancom

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 (v5.4.0)
        with:
          dotnet-version: '10.0.302'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branch: stable (verified 2026-08-28)
        with:
          components: clippy

      - name: Publish current OfficeCLI host
        run: >-
          dotnet publish ../../src/officecli/officecli.csproj
          --configuration Release
          --no-self-contained
          -p:PublishTrimmed=false
          -p:PublishSingleFile=false
          -p:NuGetAudit=false
          --output "${{ runner.temp }}/officecli-current"

      - name: Test
        run: cargo test --workspace --locked --all-targets

      - name: Test verifier executable discovery
        run: python scripts/test_executable_paths.py

      - name: Lint
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Build release plugin
        run: cargo build --release --locked --package officecli-hwpx --bins

      - name: Smoke large-file verifier
        run: python scripts/verify-large-file.py --skip-officecli --sections 1 --text-mib 1

      - name: Verify Linux native Hancom discovery and view
        if: runner.os == 'Linux'
        shell: bash
        env:
          RHWP_ASSET: ${{ matrix.rhwp_asset }}
          RHWP_SHA256: ${{ matrix.rhwp_sha256 }}
        run: |
          set -euo pipefail

          asset_dir="${RUNNER_TEMP}/hwpx-h1-assets"
          smoke_dir="${RUNNER_TEMP}/hwpx-h1-smoke"
          mkdir -p "${asset_dir}" "${smoke_dir}"

          officecli="${RUNNER_TEMP}/officecli-current/officecli"
          rhwp_archive="${asset_dir}/${RHWP_ASSET}"
          fixture="${smoke_dir}/english.hwp"

          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "${rhwp_archive}" \
            "https://github.com/edwardkim/rhwp/releases/download/${RHWP_VERSION}/${RHWP_ASSET}"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "${fixture}" "${HWP_FIXTURE_URL}"

          verify_sha256() {
            local label="$1" expected="$2" path="$3" actual
            actual="$(sha256sum "${path}" | awk '{print $1}')"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "${label} checksum mismatch: expected ${expected}, got ${actual}" >&2
              return 1
            fi
          }

          verify_sha256 RHWP "${RHWP_SHA256}" "${rhwp_archive}"
          verify_sha256 fixture "${HWP_FIXTURE_SHA256}" "${fixture}"

          tar -xzf "${rhwp_archive}" -C "${asset_dir}"
          rhwp="${asset_dir}/rhwp/rhwp"
          chmod +x "${officecli}" "${rhwp}"
          [[ "${rhwp}" == /* ]] || { echo "RHWP path is not absolute: ${rhwp}" >&2; exit 1; }
          [[ -n "$("${officecli}" --version)" ]]
          [[ "$("${rhwp}" --version)" == "rhwp v0.8.4" ]]

          legacy_hwpx="${HOME}/.officecli/plugins/dump-reader/hwpx/plugin"
          mkdir -p "$(dirname "${legacy_hwpx}")"
          printf '%s\n' 'legacy officecli-dump-reader-hwpx installation' >"${legacy_hwpx}"

          ./scripts/install.sh --no-build
          for target in \
            dump-reader/hwp \
            dump-reader/hml \
            format-handler/hwpx \
            format-handler/owpml
          do
            plugin="${HOME}/.officecli/plugins/${target}/plugin"
            [[ -x "${plugin}" ]] || { echo "plugin was not installed at ${plugin}" >&2; exit 1; }
          done
          [[ ! -e "${legacy_hwpx}" && ! -L "${legacy_hwpx}" ]]
          [[ ! -e "${HOME}/.officecli/plugins/dump-reader/owpml/plugin" ]]
          cmp --silent ./target/release/officecli-hancom-hwp \
            "${HOME}/.officecli/plugins/dump-reader/hwp/plugin"
          cmp --silent ./target/release/officecli-hancom-hwpx \
            "${HOME}/.officecli/plugins/format-handler/hwpx/plugin"

          unset OFFICECLI_PLUGIN_DUMP_READER_HWP \
            OFFICECLI_PLUGIN_DUMP_READER_HML \
            OFFICECLI_PLUGIN_FORMAT_HANDLER_HWPX \
            OFFICECLI_PLUGIN_FORMAT_HANDLER_OWPML
          "${officecli}" plugins list --json | python3 -c '
          import json
          import pathlib
          import sys

          payload = json.load(sys.stdin)
          assert payload.get("success") is True, payload
          plugins = payload.get("data", [])
          expected = {
            ("officecli-hancom-hwp", "dump-reader", "hwp"),
            ("officecli-hancom-hwp", "dump-reader", "hml"),
            ("officecli-hancom-hwpx", "format-handler", "hwpx"),
            ("officecli-hancom-hwpx", "format-handler", "owpml"),
          }
          observed = set()
          for plugin in plugins:
            parts = pathlib.Path(plugin["path"]).parts
            if len(parts) >= 3:
              observed.add((plugin.get("name"), parts[-3], parts[-2]))
          assert expected <= observed, (expected - observed, plugins)
          assert not any(
            tuple(pathlib.Path(plugin["path"]).parts[-3:-1])
            in {("dump-reader", "hwpx"), ("dump-reader", "owpml")}
            for plugin in plugins
          ), plugins
          '

          before_hash="$(sha256sum "${fixture}" | awk '{print $1}')"
          before_mtime="$(python3 -c 'import os, sys; print(os.stat(sys.argv[1]).st_mtime_ns)' "${fixture}")"
          export OFFICECLI_HWPX_CONVERTER="${rhwp}"
          view_output="$("${officecli}" view "${fixture}" text)"
          if [[ "${view_output}" != *"They have been married for fifty years."* ]]; then
            echo "OfficeCLI HWP view did not contain the expected text" >&2
            exit 1
          fi
          [[ -s "${smoke_dir}/english.docx" ]]
          if compgen -G "${smoke_dir}/*.hwpx" >/dev/null; then
            echo "HWP conversion left an intermediate HWPX beside the source" >&2
            exit 1
          fi
          [[ "$(sha256sum "${fixture}" | awk '{print $1}')" == "${before_hash}" ]]
          [[ "$(python3 -c 'import os, sys; print(os.stat(sys.argv[1]).st_mtime_ns)' "${fixture}")" == "${before_mtime}" ]]

          direct_hwpx="${smoke_dir}/english-direct.hwpx"
          "${rhwp}" export-hwpx "${fixture}" "${direct_hwpx}"
          [[ -s "${direct_hwpx}" ]]
          direct_output="$("${officecli}" view "${direct_hwpx}" text)"
          if [[ "${direct_output}" != *"They have been married for fifty years."* ]]; then
            echo "OfficeCLI direct HWPX view did not contain the expected text" >&2
            exit 1
          fi
          [[ ! -e "${smoke_dir}/english-direct.docx" ]]

          direct_owpml="${smoke_dir}/english-owpml.owpml"
          cp "${direct_hwpx}" "${direct_owpml}"
          owpml_output="$("${officecli}" view "${direct_owpml}" text)"
          if [[ "${owpml_output}" != *"They have been married for fifty years."* ]]; then
            echo "OfficeCLI OWPML discovery did not contain the expected text" >&2
            exit 1
          fi
          [[ ! -e "${smoke_dir}/english-owpml.docx" ]]

          editable="${smoke_dir}/editable.hwpx"
          python3 scripts/generate-editable-fixture.py "${editable}" --text before
          editable_before="$(sha256sum "${editable}" | awk '{print $1}')"
          "${officecli}" set "${editable}" \
            '/document/section[1]/paragraph[1]/text[1]' \
            --prop 'text=after & saved'
          "${officecli}" save "${editable}" >/dev/null
          "${officecli}" close "${editable}" >/dev/null
          edited_output="$("${officecli}" view "${editable}" text)"
          [[ "${edited_output}" == *"after & saved"* ]]
          "${officecli}" validate "${editable}" >/dev/null
          [[ "$(sha256sum "${editable}" | awk '{print $1}')" != "${editable_before}" ]]
          python3 - "${editable}" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as package:
              section = package.read("Contents/section0.xml").decode("utf-8")
          assert "after &amp; saved" in section, section
          PY
          "${officecli}" close "${editable}" >/dev/null

          editable_owpml="${smoke_dir}/editable.owpml"
          cp "${editable}" "${editable_owpml}"
          "${officecli}" set "${editable_owpml}" \
            '/document/section[1]/paragraph[2]/text[1]' \
            --prop 'text=OWPML saved'
          "${officecli}" save "${editable_owpml}" >/dev/null
          "${officecli}" close "${editable_owpml}" >/dev/null
          edited_owpml_output="$("${officecli}" view "${editable_owpml}" text)"
          [[ "${edited_owpml_output}" == *"OWPML saved"* ]]
          "${officecli}" validate "${editable_owpml}" >/dev/null
          "${officecli}" close "${editable_owpml}" >/dev/null
          [[ ! -e "${smoke_dir}/editable.docx" ]]

          hml_fixture="${smoke_dir}/discovery.hml"
          python3 - "${hml_fixture}" <<'PY'
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<HWPML Version="2.91"><BODY><SECTION><P><TEXT>'
              '<CHAR>HML discovery success</CHAR>'
              '</TEXT></P></SECTION></BODY></HWPML>',
              encoding='utf-8',
          )
          PY
          hml_output="$("${officecli}" view "${hml_fixture}" text)"
          if [[ "${hml_output}" != *"HML discovery success"* ]]; then
            echo "OfficeCLI HML discovery did not contain the expected text" >&2
            exit 1
          fi
          [[ -s "${smoke_dir}/discovery.docx" ]]

      - name: Verify Windows native Hancom discovery and view
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RHWP_ASSET: ${{ matrix.rhwp_asset }}
          RHWP_SHA256: ${{ matrix.rhwp_sha256 }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'hwpx-h1-assets'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'hwpx-h1-smoke'
          New-Item -ItemType Directory -Force -Path $assetDir, $smokeDir | Out-Null

          $officecli = Join-Path $env:RUNNER_TEMP 'officecli-current\officecli.exe'
          $rhwpArchive = Join-Path $assetDir $env:RHWP_ASSET
          $fixture = Join-Path $smokeDir 'english.hwp'

          $rhwpUrl = "https://github.com/edwardkim/rhwp/releases/download/$env:RHWP_VERSION/$env:RHWP_ASSET"
          Invoke-WebRequest -Uri $rhwpUrl -OutFile $rhwpArchive
          Invoke-WebRequest -Uri $env:HWP_FIXTURE_URL -OutFile $fixture

          function Assert-Sha256([string]$Label, [string]$Expected, [string]$Path) {
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected) {
              throw "$Label checksum mismatch: expected $Expected, got $actual"
            }
          }

          Assert-Sha256 'RHWP' $env:RHWP_SHA256 $rhwpArchive
          Assert-Sha256 'fixture' $env:HWP_FIXTURE_SHA256 $fixture

          Expand-Archive -LiteralPath $rhwpArchive -DestinationPath $assetDir -Force
          $rhwp = Join-Path $assetDir 'rhwp\rhwp.exe'
          if (-not [IO.Path]::IsPathFullyQualified($rhwp)) {
            throw "RHWP path is not absolute: $rhwp"
          }
          $officecliVersion = (& $officecli --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($officecliVersion)) {
            throw "unexpected OfficeCLI version: $officecliVersion"
          }
          $rhwpVersion = (& $rhwp --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $rhwpVersion -ne 'rhwp v0.8.4') {
            throw "unexpected RHWP version: $rhwpVersion"
          }

          $legacyHwpx = Join-Path $HOME '.officecli\plugins\dump-reader\hwpx\plugin.exe'
          [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($legacyHwpx)) | Out-Null
          [IO.File]::WriteAllText($legacyHwpx, 'legacy officecli-dump-reader-hwpx installation')

          ./scripts/install.ps1 -NoBuild
          $installedPlugins = @(
            'dump-reader\hwp',
            'dump-reader\hml',
            'format-handler\hwpx',
            'format-handler\owpml'
          ) | ForEach-Object {
            Join-Path $HOME ".officecli\plugins\$_\plugin.exe"
          }
          foreach ($plugin in $installedPlugins) {
            if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) {
              throw "plugin.exe was not installed at $plugin"
            }
          }
          if (Test-Path -LiteralPath $legacyHwpx) {
            throw "legacy dump-reader/HWPX path still shadows the format handler"
          }
          $legacyOwpml = Join-Path $HOME '.officecli\plugins\dump-reader\owpml\plugin.exe'
          if (Test-Path -LiteralPath $legacyOwpml) {
            throw "legacy dump-reader/OWPML path still shadows the format handler"
          }
          foreach ($pair in @(
            @('target\release\officecli-hancom-hwp.exe', '.officecli\plugins\dump-reader\hwp\plugin.exe'),
            @('target\release\officecli-hancom-hwpx.exe', '.officecli\plugins\format-handler\hwpx\plugin.exe')
          )) {
            $sourceHash = (Get-FileHash -LiteralPath (Join-Path $PWD $pair[0]) -Algorithm SHA256).Hash
            $installedHash = (Get-FileHash -LiteralPath (Join-Path $HOME $pair[1]) -Algorithm SHA256).Hash
            if ($sourceHash -ne $installedHash) {
              throw "installed plugin differs from $($pair[0])"
            }
          }

          foreach ($variable in @(
            'OFFICECLI_PLUGIN_DUMP_READER_HWP',
            'OFFICECLI_PLUGIN_DUMP_READER_HML',
            'OFFICECLI_PLUGIN_FORMAT_HANDLER_HWPX',
            'OFFICECLI_PLUGIN_FORMAT_HANDLER_OWPML'
          )) {
            Remove-Item "Env:$variable" -ErrorAction SilentlyContinue
          }
          $pluginsRaw = (& $officecli plugins list --json 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "officecli plugins list failed: $pluginsRaw"
          }
          $plugins = $pluginsRaw | ConvertFrom-Json
          if (-not $plugins.success) {
            throw "officecli plugins list returned an unsuccessful envelope: $pluginsRaw"
          }
          $expectedByPath = @{
            ([IO.Path]::GetFullPath($installedPlugins[0])) = @('officecli-hancom-hwp', '.hwp', '.hml')
            ([IO.Path]::GetFullPath($installedPlugins[1])) = @('officecli-hancom-hwp', '.hwp', '.hml')
            ([IO.Path]::GetFullPath($installedPlugins[2])) = @('officecli-hancom-hwpx', '.hwpx', '.owpml')
            ([IO.Path]::GetFullPath($installedPlugins[3])) = @('officecli-hancom-hwpx', '.hwpx', '.owpml')
          }
          foreach ($expectedPath in $expectedByPath.Keys) {
            $match = @($plugins.data | Where-Object {
              [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetFullPath($_.path),
                $expectedPath
              )
            })
            if ($match.Count -ne 1) {
              throw "plugins list did not enumerate exactly one plugin at $($expectedPath): $pluginsRaw"
            }
            $expected = $expectedByPath[$expectedPath]
            if ($match[0].name -ne $expected[0] -or
                -not ($match[0].extensions -contains $expected[1]) -or
                -not ($match[0].extensions -contains $expected[2])) {
              throw "unexpected manifest at $($expectedPath): $pluginsRaw"
            }
          }

          $beforeHash = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $beforeMtime = (Get-Item -LiteralPath $fixture).LastWriteTimeUtc.Ticks
          $env:OFFICECLI_HWPX_CONVERTER = $rhwp
          $viewOutput = (& $officecli view $fixture text 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI HWP view failed: $viewOutput"
          }
          if (-not $viewOutput.Contains('They have been married for fifty years.')) {
            throw "OfficeCLI HWP view did not contain the expected text: $viewOutput"
          }
          $docx = Join-Path $smokeDir 'english.docx'
          if (-not (Test-Path -LiteralPath $docx -PathType Leaf)) {
            throw "OfficeCLI HWP view did not create a sibling DOCX"
          }
          if ((Get-Item -LiteralPath $docx).Length -le 0) {
            throw "OfficeCLI HWP view did not create a non-empty sibling DOCX"
          }
          $intermediateHwpx = @(Get-ChildItem -LiteralPath $smokeDir -Filter '*.hwpx' -File)
          if ($intermediateHwpx.Count -ne 0) {
            throw "HWP conversion left an intermediate HWPX beside the source"
          }
          $afterHash = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $afterMtime = (Get-Item -LiteralPath $fixture).LastWriteTimeUtc.Ticks
          if ($afterHash -ne $beforeHash -or $afterMtime -ne $beforeMtime) {
            throw "OfficeCLI HWP view modified the source fixture"
          }

          $directHwpx = Join-Path $smokeDir 'english-direct.hwpx'
          & $rhwp export-hwpx $fixture $directHwpx
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path -LiteralPath $directHwpx -PathType Leaf) -or
              (Get-Item -LiteralPath $directHwpx).Length -le 0) {
            throw "RHWP did not create the direct HWPX regression fixture"
          }
          $directOutput = (& $officecli view $directHwpx text 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              -not $directOutput.Contains('They have been married for fifty years.')) {
            throw "OfficeCLI direct HWPX view failed: $directOutput"
          }
          $directDocx = Join-Path $smokeDir 'english-direct.docx'
          if (Test-Path -LiteralPath $directDocx) {
            throw "format-handler HWPX view unexpectedly created a sibling DOCX"
          }

          $directOwpml = Join-Path $smokeDir 'english-owpml.owpml'
          Copy-Item -LiteralPath $directHwpx -Destination $directOwpml
          $owpmlOutput = (& $officecli view $directOwpml text 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              -not $owpmlOutput.Contains('They have been married for fifty years.')) {
            throw "OfficeCLI OWPML discovery failed: $owpmlOutput"
          }
          $owpmlDocx = Join-Path $smokeDir 'english-owpml.docx'
          if (Test-Path -LiteralPath $owpmlDocx) {
            throw "format-handler OWPML view unexpectedly created a sibling DOCX"
          }

          $editable = Join-Path $smokeDir 'editable.hwpx'
          & python scripts/generate-editable-fixture.py $editable --text before
          if ($LASTEXITCODE -ne 0) {
            throw "failed to generate strict editable HWPX fixture"
          }
          $editableBefore = (Get-FileHash -LiteralPath $editable -Algorithm SHA256).Hash
          $setOutput = (& $officecli set $editable '/document/section[1]/paragraph[1]/text[1]' --prop 'text=after & saved' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI HWPX set failed: $setOutput"
          }
          & $officecli save $editable | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI HWPX save failed"
          }
          & $officecli close $editable | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI HWPX close failed after save"
          }
          $editedOutput = (& $officecli view $editable text 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not $editedOutput.Contains('after & saved')) {
            throw "saved HWPX did not reopen with edited text: $editedOutput"
          }
          & $officecli validate $editable | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI HWPX validate failed after save"
          }
          $editableAfter = (Get-FileHash -LiteralPath $editable -Algorithm SHA256).Hash
          if ($editableAfter -eq $editableBefore) {
            throw "OfficeCLI HWPX set did not change the source package"
          }
          $savedSection = (& python -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("Contents/section0.xml").decode("utf-8"))' $editable | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not $savedSection.Contains('after &amp; saved')) {
            throw "saved HWPX section does not contain escaped edited text"
          }
          & $officecli close $editable | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI HWPX close failed after reopen verification"
          }

          $editableOwpml = Join-Path $smokeDir 'editable.owpml'
          Copy-Item -LiteralPath $editable -Destination $editableOwpml
          $owpmlSetOutput = (& $officecli set $editableOwpml '/document/section[1]/paragraph[2]/text[1]' --prop 'text=OWPML saved' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI OWPML set failed: $owpmlSetOutput"
          }
          & $officecli save $editableOwpml | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI OWPML save failed"
          }
          & $officecli close $editableOwpml | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI OWPML close failed after save"
          }
          $editedOwpmlOutput = (& $officecli view $editableOwpml text 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not $editedOwpmlOutput.Contains('OWPML saved')) {
            throw "saved OWPML did not reopen with edited text: $editedOwpmlOutput"
          }
          & $officecli validate $editableOwpml | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI OWPML validate failed after save"
          }
          & $officecli close $editableOwpml | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeCLI OWPML close failed after reopen verification"
          }
          if (Test-Path -LiteralPath (Join-Path $smokeDir 'editable.docx')) {
            throw "format-handler edit created an unintended sibling DOCX"
          }

          $hmlFixture = Join-Path $smokeDir 'discovery.hml'
          $hmlXml = '<?xml version="1.0" encoding="UTF-8"?><HWPML Version="2.91"><BODY><SECTION><P><TEXT><CHAR>HML discovery success</CHAR></TEXT></P></SECTION></BODY></HWPML>'
          [IO.File]::WriteAllText($hmlFixture, $hmlXml, [Text.UTF8Encoding]::new($false))
          $hmlOutput = (& $officecli view $hmlFixture text 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not $hmlOutput.Contains('HML discovery success')) {
            throw "OfficeCLI HML discovery failed: $hmlOutput"
          }
          $hmlDocx = Join-Path $smokeDir 'discovery.docx'
          if (-not (Test-Path -LiteralPath $hmlDocx -PathType Leaf) -or
              (Get-Item -LiteralPath $hmlDocx).Length -le 0) {
            throw "OfficeCLI HML view did not create a non-empty sibling DOCX"
          }

      - name: Uninstall Hancom plugin on Linux
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          if [[ -x ./scripts/install.sh ]]; then
            ./scripts/install.sh --uninstall
            for target in \
              dump-reader/hwp \
              dump-reader/hml \
              format-handler/hwpx \
              format-handler/owpml \
              dump-reader/hwpx \
              dump-reader/owpml
            do
              plugin="${HOME}/.officecli/plugins/${target}/plugin"
              if [[ -e "${plugin}" || -L "${plugin}" ]]; then
                echo "${target} plugin remained after uninstall" >&2
                exit 1
              fi
            done
          fi

      - name: Uninstall Hancom plugin on Windows
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath ./scripts/install.ps1 -PathType Leaf) {
            ./scripts/install.ps1 -Uninstall
            foreach ($target in @(
              'dump-reader\hwp',
              'dump-reader\hml',
              'format-handler\hwpx',
              'format-handler\owpml',
              'dump-reader\hwpx',
              'dump-reader\owpml'
            )) {
              $plugin = Join-Path $HOME ".officecli\plugins\$target\plugin.exe"
              if (Test-Path -LiteralPath $plugin) {
                throw "$target plugin remained after uninstall"
              }
            }
          }
