name: Workflow action pins

on:
  pull_request_target:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted checker revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout untrusted pull request as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          # This checkout is parsed as bounded data and is never executed.
          allow-unsafe-pr-checkout: true
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 (v7.0.0)
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: trusted/scripts/requirements-action-pins.txt
      - name: Install checker dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: --require-hashes
          -r trusted/scripts/requirements-action-pins.txt
      - name: Audit untrusted pull request with the base checker
        if: github.event_name == 'pull_request_target'
        env:
          ACTION_PIN_AUDIT_ROOT: ${{ github.workspace }}/candidate
        run: python trusted/scripts/test-workflow-action-pins.py
      - name: Audit pushed revision
        if: github.event_name == 'push'
        run: python trusted/scripts/test-workflow-action-pins.py
